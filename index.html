<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wild Moon — Coming Soon</title>
  <meta name="description" content="Wild Moon is coming. Be the first to know when we launch.">
  <meta property="og:title" content="Wild Moon — Coming Soon">
  <meta property="og:description" content="Something bold is coming. Wild Music Group Ltd — Marietta, OH.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wildmoon.org/">
  <meta property="og:image" content="https://wildmoon.org/assets/images/og-image.avif">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://wildmoon.org/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <style type="text/tailwindcss">
    @theme {
      --color-gold: #c8a850;
      --color-gold-light: #dfc27a;
      --color-gold-dim: #8a6f2e;
      --color-base: #08080f;
      --color-surface: #0f0f1a;
      --color-surface-2: #161625;
      --font-cinzel: 'Cinzel', serif;
      --font-inter: 'Inter', sans-serif;
    }
  </style>

  <style>
    /* ─── Reset & base ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #08080f;
      color: #e8e0cc;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ─── Skip link ─── */
    .skip-link {
      position: absolute;
      left: -9999px;
      top: auto;
      z-index: 9999;
    }
    .skip-link:focus {
      left: 1rem;
      top: 1rem;
      background: #c8a850;
      color: #08080f;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-weight: 600;
      text-decoration: none;
    }

    /* ─── Cinematic background ─── */
    .bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%,   rgba(200, 168, 80, 0.07) 0%, transparent 70%),
        radial-gradient(ellipse 60% 80% at 80% 100%,  rgba(200, 168, 80, 0.05) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 20% 60%,   rgba(200, 168, 80, 0.04) 0%, transparent 55%),
        linear-gradient(180deg, #08080f 0%, #0c0c18 50%, #08080f 100%);
    }

    /* Subtle grain texture */
    .bg-canvas::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      background-size: 256px 256px;
      opacity: 0.6;
      pointer-events: none;
    }

    /* Slow drifting orb */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 {
      width: min(600px, 80vw);
      height: min(600px, 80vw);
      top: -15%;
      left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(200,168,80,0.09) 0%, transparent 70%);
      animation: drift1 18s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: min(400px, 60vw);
      height: min(400px, 60vw);
      bottom: -10%;
      right: -10%;
      background: radial-gradient(circle, rgba(200,168,80,0.06) 0%, transparent 70%);
      animation: drift2 22s ease-in-out infinite alternate;
    }

    @keyframes drift1 {
      from { transform: translateX(-50%) translateY(0) scale(1); }
      to   { transform: translateX(-50%) translateY(40px) scale(1.08); }
    }
    @keyframes drift2 {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(-30px, -20px) scale(1.05); }
    }

    /* ─── Horizontal rule / divider ─── */
    .gold-rule {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c8a850, transparent);
    }

    /* ─── Wordmark ─── */
    .wordmark {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #c8a850;
      line-height: 1;
      text-shadow:
        0 0 40px rgba(200,168,80,0.35),
        0 0 80px rgba(200,168,80,0.15);
    }

    .wordmark-sub {
      font-family: 'Cinzel', serif;
      font-weight: 400;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: rgba(200,168,80,0.55);
      font-size: clamp(0.6rem, 1.8vw, 0.78rem);
    }

    /* ─── Tagline ─── */
    .tagline {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      color: rgba(232,224,204,0.75);
      letter-spacing: 0.04em;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      font-style: italic;
    }

    /* ─── Contact prompt ─── */
    .contact-label {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: clamp(0.78rem, 2vw, 0.9rem);
      color: rgba(232,224,204,0.45);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .contact-link {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: clamp(0.9rem, 2.5vw, 1.05rem);
      color: #c8a850;
      text-decoration: none;
      letter-spacing: 0.03em;
      transition: color 0.25s ease, text-shadow 0.25s ease;
      display: inline-block;
      padding: 0.15rem 0;
      border-bottom: 1px solid rgba(200,168,80,0.3);
    }
    .contact-link:hover,
    .contact-link:focus-visible {
      color: #dfc27a;
      text-shadow: 0 0 20px rgba(200,168,80,0.5);
      border-bottom-color: rgba(200,168,80,0.7);
      outline: none;
    }
    .contact-link:focus-visible {
      outline: 2px solid #c8a850;
      outline-offset: 3px;
      border-radius: 2px;
    }

    /* ─── Footer note ─── */
    .footer-note {
      font-size: 0.72rem;
      color: rgba(232,224,204,0.22);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ─── Content fade-in ─── */
    .fade-in {
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.9s ease forwards;
    }
    .fade-in:nth-child(1) { animation-delay: 0.1s; }
    .fade-in:nth-child(2) { animation-delay: 0.3s; }
    .fade-in:nth-child(3) { animation-delay: 0.5s; }
    .fade-in:nth-child(4) { animation-delay: 0.7s; }
    .fade-in:nth-child(5) { animation-delay: 0.9s; }
    .fade-in:nth-child(6) { animation-delay: 1.1s; }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ─── Reduced motion ─── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      .fade-in { opacity: 1; transform: none; }
    }

    /* ─── Main content wrapper ─── */
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      max-width: 640px;
      width: 100%;
    }

    /* Focus visible globally */
    :focus-visible {
      outline: 2px solid #c8a850;
      outline-offset: 3px;
    }

    /* Minimum touch targets */
    a, button { min-height: 24px; min-width: 24px; }
  </style>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "EntertainmentBusiness",
    "name": "Wild Music Group Ltd",
    "url": "https://wildmoon.org",
    "logo": "https://wildmoon.org/favicon.svg",
    "description": "Wild Music Group Ltd — artist management, music marketing, and entertainment services based in Marietta, OH.",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Marietta",
      "addressRegion": "OH",
      "addressCountry": "US"
    },
    "naics": "711410",
    "email": "info@wildmoon.org",
    "sameAs": []
  }
  </script>
</head>
<body>

  <a href="#main" class="skip-link">Skip to content</a>

  <!-- Atmospheric background -->
  <div class="bg-canvas" aria-hidden="true"></div>
  <div class="orb orb-1" aria-hidden="true"></div>
  <div class="orb orb-2" aria-hidden="true"></div>

  <!-- Main content -->
  <main id="main" class="content" role="main">

    <!-- Moon glyph / icon -->
    <div class="fade-in" aria-hidden="true">
      <svg width="52" height="52" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Crescent moon">
        <circle cx="26" cy="26" r="24" stroke="rgba(200,168,80,0.25)" stroke-width="1"/>
        <!-- Crescent moon -->
        <path d="M30 10.5C21.4 12.2 15 19.9 15 29c0 9.1 6.4 16.8 15 18.5C20.8 44.6 14 37.3 14 28.5c0-8.8 6.8-16.1 16-18z" fill="#c8a850" opacity="0.85"/>
        <path d="M32 8C22.6 9.5 15.5 17.8 15.5 28c0 10.2 7.1 18.5 16.5 20 -7.2-2.8-12.5-9.6-12.5-17.6 0-8 5.3-14.8 12.5-17.4z" fill="#c8a850"/>
        <!-- Stars -->
        <circle cx="38" cy="14" r="1.2" fill="#c8a850" opacity="0.6"/>
        <circle cx="43" cy="22" r="0.8" fill="#c8a850" opacity="0.4"/>
        <circle cx="36" cy="8"  r="0.7" fill="#c8a850" opacity="0.35"/>
      </svg>
    </div>

    <!-- Wordmark -->
    <div class="fade-in" style="display:flex;flex-direction:column;align-items:center;gap:0.6rem;">
      <h1 class="wordmark" style="font-size: clamp(2.4rem, 8vw, 4rem);">Wild Moon</h1>
      <p class="wordmark-sub">Wild Music Group Ltd</p>
    </div>

    <!-- Divider -->
    <div class="fade-in gold-rule" role="separator" aria-hidden="true"></div>

    <!-- Tagline -->
    <div class="fade-in">
      <p class="tagline">Something bold is coming.</p>
    </div>

    <!-- Contact prompt -->
    <div class="fade-in" style="display:flex;flex-direction:column;align-items:center;gap:0.75rem;">
      <p class="contact-label">Be the first to know</p>
      <a
        href="mailto:info@wildmoon.org"
        class="contact-link"
        aria-label="Email Wild Music Group at info@wildmoon.org"
      >info@wildmoon.org</a>
    </div>

    <!-- Footer note -->
    <div class="fade-in">
      <p class="footer-note">Marietta, OH &nbsp;&middot;&nbsp; &copy; 2026 Wild Music Group Ltd</p>
    </div>

  </main>

</body>
</html>
