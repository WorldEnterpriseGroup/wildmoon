<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wild Moon — Coming Soon</title>
  <meta name="description" content="Wild Moon is coming. Be the first to know when we launch.">
  <meta property="og:title" content="Wild Moon — Coming Soon">
  <meta property="og:description" content="Something luminous is coming. Wild Moon — music, artists, and a brand being born.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wildmoon.org/">
  <meta property="og:image" content="https://wildmoon.org/assets/images/og-image.avif">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://wildmoon.org/">
  <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-moon:      #c2d8f8;
      --color-moon-soft: #ddeeff;
      --color-moon-dim:  #6880a8;
      --color-base:      #03040e;
      --color-surface:   #070b1a;
      --font-cinzel:     'Cinzel', serif;
      --font-inter:      'Inter', sans-serif;
    }
  </style>

  <style>
    /* ─── Reset ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #03040e;
      color: #dde6f8;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ─── Skip link ─── */
    .skip-link {
      position: absolute;
      left: -9999px;
      top: auto;
      z-index: 9999;
    }
    .skip-link:focus {
      left: 1rem;
      top: 1rem;
      background: #c2d8f8;
      color: #03040e;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-weight: 600;
      text-decoration: none;
    }

    /* ─── Deep midnight sky background ─── */
    .bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 90% 55% at 50% -10%,  rgba(100, 140, 220, 0.09) 0%, transparent 65%),
        radial-gradient(ellipse 60% 70% at 85% 90%,   rgba(80,  110, 200, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse 45% 45% at 10% 55%,   rgba(120, 155, 230, 0.05) 0%, transparent 55%),
        linear-gradient(180deg, #03040e 0%, #060a1a 45%, #04060f 100%);
    }

    /* Subtle film grain */
    .bg-canvas::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      background-size: 256px 256px;
      opacity: 0.5;
      pointer-events: none;
    }

    /* ─── Drifting moonlight orbs ─── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 {
      width: min(640px, 85vw);
      height: min(640px, 85vw);
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(160, 195, 255, 0.10) 0%, rgba(100, 140, 230, 0.04) 50%, transparent 70%);
      animation: drift1 20s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: min(420px, 65vw);
      height: min(420px, 65vw);
      bottom: -12%;
      right: -8%;
      background: radial-gradient(circle, rgba(140, 170, 240, 0.07) 0%, transparent 70%);
      animation: drift2 26s ease-in-out infinite alternate;
    }
    .orb-3 {
      width: min(300px, 50vw);
      height: min(300px, 50vw);
      top: 60%;
      left: -8%;
      background: radial-gradient(circle, rgba(180, 210, 255, 0.05) 0%, transparent 70%);
      animation: drift3 30s ease-in-out infinite alternate;
    }

    @keyframes drift1 {
      from { transform: translateX(-50%) translateY(0)   scale(1); }
      to   { transform: translateX(-50%) translateY(50px) scale(1.1); }
    }
    @keyframes drift2 {
      from { transform: translate(0, 0)       scale(1); }
      to   { transform: translate(-25px, -30px) scale(1.06); }
    }
    @keyframes drift3 {
      from { transform: translate(0, 0)       scale(1); }
      to   { transform: translate(20px, -25px) scale(1.04); }
    }

    /* ─── Divider ─── */
    .moon-rule {
      width: 64px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(180, 215, 255, 0.5), transparent);
    }

    /* ─── Wordmark ─── */
    .wordmark {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #c8dcfa;
      line-height: 1;
      text-shadow:
        0 0 40px rgba(160, 200, 255, 0.4),
        0 0 90px rgba(120, 170, 255, 0.15);
    }

    .wordmark-sub {
      font-family: 'Cinzel', serif;
      font-weight: 400;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: rgba(160, 195, 245, 0.45);
      font-size: clamp(0.58rem, 1.8vw, 0.76rem);
    }

    /* ─── Tagline ─── */
    .tagline {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      color: rgba(210, 225, 250, 0.65);
      letter-spacing: 0.03em;
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      font-style: italic;
    }

    /* ─── Contact prompt ─── */
    .contact-label {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: clamp(0.72rem, 1.8vw, 0.85rem);
      color: rgba(180, 205, 245, 0.4);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .contact-link {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: clamp(0.88rem, 2.4vw, 1rem);
      color: #a8c8f0;
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.25s ease, text-shadow 0.25s ease;
      display: inline-block;
      padding: 0.15rem 0;
      border-bottom: 1px solid rgba(150, 190, 240, 0.25);
    }
    .contact-link:hover {
      color: #cce0ff;
      text-shadow: 0 0 22px rgba(160, 205, 255, 0.5);
      border-bottom-color: rgba(160, 205, 255, 0.5);
    }
    .contact-link:focus-visible {
      outline: 2px solid #a8c8f0;
      outline-offset: 3px;
      border-radius: 2px;
      color: #cce0ff;
    }

    /* ─── Footer note ─── */
    .footer-note {
      font-size: 0.7rem;
      color: rgba(180, 205, 245, 0.2);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ─── Staggered fade-in ─── */
    .fade-in {
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUp 1s ease forwards;
    }
    .fade-in:nth-child(1) { animation-delay: 0.15s; }
    .fade-in:nth-child(2) { animation-delay: 0.35s; }
    .fade-in:nth-child(3) { animation-delay: 0.55s; }
    .fade-in:nth-child(4) { animation-delay: 0.75s; }
    .fade-in:nth-child(5) { animation-delay: 0.95s; }
    .fade-in:nth-child(6) { animation-delay: 1.15s; }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Moon SVG slow rotation */
    .moon-glyph {
      animation: moonRotate 60s linear infinite;
      transform-origin: center;
    }

    @keyframes moonRotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ─── Reduced motion ─── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      .fade-in { opacity: 1; transform: none; }
    }

    /* ─── Content wrapper ─── */
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      max-width: 600px;
      width: 100%;
    }

    /* ─── Focus & touch ─── */
    :focus-visible { outline: 2px solid #a8c8f0; outline-offset: 3px; }
    a, button { min-height: 24px; min-width: 24px; }
  </style>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "EntertainmentBusiness",
    "name": "Wild Music Group Ltd",
    "url": "https://wildmoon.org",
    "logo": "https://wildmoon.org/favicon.svg",
    "description": "Wild Music Group Ltd — artist management, music marketing, and entertainment services based in Marietta, OH.",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Marietta",
      "addressRegion": "OH",
      "addressCountry": "US"
    },
    "naics": "711410",
    "email": "info@wildmoon.org"
  }
  </script>
</head>
<body>

  <a href="#main" class="skip-link">Skip to content</a>

  <!-- Background atmosphere -->
  <div class="bg-canvas" aria-hidden="true"></div>
  <div class="orb orb-1" aria-hidden="true"></div>
  <div class="orb orb-2" aria-hidden="true"></div>
  <div class="orb orb-3" aria-hidden="true"></div>

  <main id="main" class="content" role="main">

    <!-- Crescent moon glyph -->
    <div class="fade-in">
      <svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Crescent moon">
        <!-- Outer ring — slow orbit -->
        <circle class="moon-glyph" cx="28" cy="28" r="25" stroke="rgba(160,200,255,0.12)" stroke-width="0.75" stroke-dasharray="4 6"/>
        <!-- Inner ring -->
        <circle cx="28" cy="28" r="19" stroke="rgba(160,200,255,0.08)" stroke-width="0.5"/>
        <!-- Crescent -->
        <path d="M32 9.5C22.8 11.4 16 19.5 16 29c0 9.5 6.8 17.6 16 19.5C23 45.6 16.5 37.9 16.5 29c0-8.9 6.5-16.6 15.5-19.5z" fill="rgba(200,225,255,0.9)"/>
        <path d="M34.5 7C24.5 8.8 17 17.5 17 28c0 10.5 7.5 19.2 17.5 21C27 46 21 38.5 21 29.5c0-9 6-16.5 13.5-22.5z" fill="#c2d8f8"/>
        <!-- Stars -->
        <circle cx="42" cy="13" r="1.1" fill="rgba(200,225,255,0.55)"/>
        <circle cx="46" cy="22" r="0.7" fill="rgba(200,225,255,0.35)"/>
        <circle cx="40" cy="7"  r="0.65" fill="rgba(200,225,255,0.3)"/>
        <circle cx="48" cy="32" r="0.5" fill="rgba(200,225,255,0.2)"/>
      </svg>
    </div>

    <!-- Wordmark -->
    <div class="fade-in" style="display:flex;flex-direction:column;align-items:center;gap:0.65rem;">
      <h1 class="wordmark" style="font-size: clamp(2.2rem, 7.5vw, 3.75rem);">Wild Moon</h1>
    </div>

    <!-- Divider -->
    <div class="fade-in moon-rule" role="separator" aria-hidden="true"></div>

    <!-- Tagline -->
    <div class="fade-in">
      <p class="tagline">Something luminous is coming.</p>
    </div>

    <!-- Contact -->
    <div class="fade-in" style="display:flex;flex-direction:column;align-items:center;gap:0.75rem;">
      <p class="contact-label">Be the first to know</p>
      <a href="mailto:info@wildmoon.org" class="contact-link" aria-label="Email Wild Moon at info@wildmoon.org">info@wildmoon.org</a>
    </div>

    <!-- Footer note -->
    <div class="fade-in">
      <p class="footer-note">Marietta, OH &nbsp;&middot;&nbsp; &copy; 2026 Wild Moon</p>
    </div>

  </main>

</body>
</html>
